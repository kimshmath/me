<!doctype html>
<html lang="ko">
<head>

<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Nanum Gothic","Noto Sans KR",-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;text-align:center}
h1{font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;font-weight:700;font-size:clamp(24px,5vw,34px);margin:0 0 14px}
p{color:var(--grey);font-size:15px;line-height:1.7;margin:0}
a{color:var(--ink);text-decoration-color:var(--rule);text-underline-offset:3px}
</style>
</head>
<body>
